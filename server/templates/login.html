<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Inventory - Iniciar sesi&oacute;n</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'Century Gothic';
            src: local('Century Gothic'), local('CenturyGothic');
        }
        :root {
            --cg-font: 'Century Gothic', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            --primary: #1a73e8;
            --gray-50: #f8f9fa;
            --gray-200: #e8eaed;
            --gray-500: #9aa0a6;
            --gray-700: #5f6368;
            --gray-900: #202124;
        }
        * { font-family: var(--cg-font) !important; }
        body {
            background: var(--gray-50);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-wrapper {
            width: 100%;
            max-width: 420px;
            padding: 0 20px;
        }
        .login-card {
            background: #fff;
            border: 1px solid var(--gray-200);
            border-radius: 16px;
            padding: 40px 36px 32px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .login-logo {
            text-align: center;
            margin-bottom: 28px;
        }
        .login-logo i {
            font-size: 2.5rem;
            color: var(--primary);
        }
        .login-logo h4 {
            font-weight: 700;
            color: var(--gray-900);
            margin-top: 8px;
            margin-bottom: 4px;
        }
        .login-logo p {
            font-size: 0.82rem;
            color: var(--gray-500);
            margin: 0;
        }
        .form-label {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--gray-700);
        }
        .form-control {
            border-radius: 8px;
            border: 1px solid var(--gray-200);
            padding: 10px 14px;
            font-size: 0.9rem;
            background: var(--gray-50);
        }
        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26,115,232,0.12);
            background: #fff;
        }
        .btn-login {
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px;
            font-size: 0.9rem;
            font-weight: 700;
            width: 100%;
            transition: background 0.2s;
        }
        .btn-login:hover { background: #1565c0; color: #fff; }
        .login-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 0.72rem;
            color: var(--gray-500);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="login-card">
        <div class="login-logo">
            <i class="bi bi-shield-lock-fill"></i>
            <h4>PC Inventory</h4>
            <p>Inicia sesi&oacute;n para continuar</p>
        </div>

        {% if error %}
        <div class="alert alert-danger py-2 px-3" style="font-size:0.82rem;border-radius:8px">
            <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <input type="text" class="form-control" name="username" required
                       autocomplete="username" autofocus
                       placeholder="Ingresa tu usuario">
            </div>
            <div class="mb-4">
                <label class="form-label">Contrase&ntilde;a</label>
                <input type="password" class="form-control" name="password" required
                       autocomplete="current-password"
                       placeholder="Ingresa tu contrase&ntilde;a">
            </div>
            <button type="submit" class="btn btn-login">
                <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar sesi&oacute;n
            </button>
        </form>
    </div>

    <div class="login-footer">
        <i class="bi bi-shield-check"></i>
        Sesi&oacute;n protegida &bull; ITDeskManager
    </div>
</div>

</body>
</html>
